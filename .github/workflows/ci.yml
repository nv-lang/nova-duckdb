# The long DuckDB build, run by hand. Everything that judges this package lives in
# pkg-gate.yml.
#
# ── What this file used to be, and why it could not work ────────────────────
#
# It also carried a `test` job, on a windows + ubuntu matrix, which never ran until
# 2026-09-09 because the package had no remote. The first run failed, and failed for
# two reasons rather than one:
#
#   1. it downloaded `native/lib` from the last successful run of THIS workflow,
#      with `if_no_artifact_found: fail`. On the first push there is no such run.
#      A bootstrap that requires a human to remember a manual trigger first is the
#      thing pkg-gate's own header calls not-a-mechanism;
#
#   2. and deeper: its "Nova toolchain" step was
#      `run: echo "the nova CLI comes from the monorepo checkout; see nova.sh"`.
#      An echo. No compiler was ever fetched or built, and `nova.sh` looks for a
#      sibling `../nova` checkout that does not exist on a runner. Every step after
#      it would have failed even with the artefact in place.
#
# The second is worth naming plainly: a step with a name and no action reads, in a
# green log, exactly like a step that did something. This one had never been run, so
# nothing contradicted it.
#
# pkg-gate.yml does the judging now. It checks out nova, builds the compiler, builds
# DuckDB with a cache (slow once, fast after), refuses to continue if the library is
# missing rather than skipping, and asserts the test COUNT rather than the runner's
# per-file PASS line.
#
# ── The gap this leaves, named rather than hidden ───────────────────────────
#
# pkg-gate runs on ubuntu only, so nothing tests Windows in CI. Development happens
# on Windows and the suite is run there by hand every time, which is why this is a
# gap and not a hole -- but it is a gap, and it belongs in a report rather than in
# an assumption. Adding it means building the nova compiler on a Windows runner,
# which is a cost to weigh, not an oversight to fix in passing.
# [M-duckdb-ci-windows]

name: ci

on:
  workflow_dispatch:

jobs:
  # Run after a DuckDB bump. Produces the static libraries for both platforms as a
  # downloadable artefact, so a developer without an hour to spare can fetch them
  # instead of building. pkg-gate does not use these -- it builds its own, cached.
  build-duckdb:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Tools
        uses: lukka/get-cmake@latest

      - name: Build DuckDB (Windows)
        if: runner.os == 'Windows'
        run: pwsh -File scripts/build-duckdb.ps1

      - name: Build DuckDB (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build-duckdb.sh

      # Before the upload, so a drifted list fails the job instead of being
      # published as an artefact that later jobs trust.
      - name: '[ffi] libs still matches what the build produced'
        run: python scripts/check-libs-manifest.py

      # A build that produced nothing must not upload an empty artefact: the next
      # consumer would restore it and read the emptiness as "already built".
      - name: The build actually produced libraries
        shell: bash
        run: |
          set -uo pipefail
          n=$(ls native/lib/*.a native/lib/*.lib 2>/dev/null | wc -l)
          echo "archives produced: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::the build produced no libraries — refusing to upload an empty artefact"
            exit 1
          fi

      - name: Upload the static libraries
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-lib-${{ runner.os }}
          path: |
            native/lib/
            scripts/libs-manifest.txt
          retention-days: 90
