# The gate every sibling package has (plan 275 F.4) and this one did not.
#
# WHY IT EXISTS. A mechanism only the person who remembers it can start is not a
# mechanism. Two things here are remembered rather than checked otherwise:
# that a release tag stands over a manifest declaring the same version, and that
# the package resolves through its lock rather than through a local override.
# nova-polaris carried v0.1.4 over a manifest saying 0.1.3 until the check existed.
#
# WHAT IS DIFFERENT HERE. This package has a native dependency: DuckDB, built from
# a pinned submodule. Nothing can be tested until that library exists, so this gate
# builds it. The first run is long -- tens of minutes -- and the cache makes every
# run after it cheap. The alternative, skipping the tests when the library is
# absent, is the failure mode this repository has spent a day finding in other
# forms: a green that measures nothing. So a missing library FAILS here.
#
# THE OVERRIDE IS THE POINT. nova.override.toml is gitignored and never reaches CI,
# so resolution goes through the lock and the manifests -- precisely the combination
# no local run exercises.
name: pkg-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    # The name says the WHOLE scope on purpose. It used to say
    # `guards + duckdb + nova test src`, which was honest and still misled:
    # a truthful narrow scope reads as completeness when the remainder is not
    # named beside it. `examples` sat outside it for the package's whole life
    # and nobody noticed, because nothing claimed otherwise.
    name: guards + duckdb + nova test src + examples type-check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout this package
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: pkg

      # Full history: the compiler build reads its own git metadata, and the
      # runtime submodule is mandatory (plan 22 F2 aborts without libuv).
      - name: Checkout nova (compiler + runtime + std)
        uses: actions/checkout@v4
        with:
          repository: nv-lang/nova
          submodules: recursive
          fetch-depth: 0
          path: nova

      - name: Setup Rust toolchain (pinned to nova's MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Install system deps (docs/guide/linux-build.md recipe, plus ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build make libgc-dev libuv1-dev build-essential

      - name: Cache cargo registry + nova-cli target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nova/nova-cli/target
          key: ${{ runner.os }}-pkggate-${{ hashFiles('nova/nova-cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pkggate-

      # Keyed on the submodule commit AND the build script: a change to either
      # changes the library. The script's own cache stamp keys on the cmake flags,
      # which is the same reasoning one level down.
      - name: Cache the built DuckDB
        uses: actions/cache@v4
        with:
          path: pkg/native/lib
          key: ${{ runner.os }}-duckdb-${{ hashFiles('pkg/native/duckdb/.git', 'pkg/scripts/build-duckdb.sh') }}

      - name: Build nova
        working-directory: nova/nova-cli
        run: cargo build --release

      - name: Build DuckDB (long on a cold cache, minutes on a warm one)
        working-directory: pkg
        run: ./scripts/build-duckdb.sh

      # The library must be there. Absent means the build failed quietly, and a
      # skipped test suite would report that as success.
      # Before the build is judged: if the twins disagree, the Linux result says
      # nothing about the Windows one, and the manifest comparison below would be
      # comparing against a list built by a different script.
      - name: The two build scripts agree
        working-directory: pkg
        run: python3 scripts/check-build-twins.py

      - name: The libraries exist and match the manifest
        working-directory: pkg
        run: |
          set -uo pipefail
          n=$(ls native/lib/*.a 2>/dev/null | wc -l)
          echo "archives in native/lib: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::no libraries were produced — the tests below would have measured nothing"
            exit 1
          fi
          python3 scripts/check-libs-manifest.py

      # Every guard this repository ships, not a list to keep in step with.
      #
      # CORRECTED 2026-09-09: this globbed only `scripts/guards/check-*.sh`, which is
      # the MAIN repository's layout. This package keeps its checkers in
      # `scripts/check-*.py`, so the loop matched nothing, printed a warning and
      # passed -- a step that could not fail, sitting inside the step whose whole
      # point is not keeping a list. Meanwhile the real checkers were a list: two
      # named steps above, and a third added the same day would have been called by
      # nobody.
      #
      # check-build-twins.py consequently runs TWICE: once early, where its own
      # comment argues it belongs (before the build is judged), and once here. A
      # tenth of a second is a fair price for never maintaining the list again; a
      # list of exclusions would be the same problem wearing a different hat.
      - name: Guards of this repository
        working-directory: pkg
        run: |
          set -uo pipefail
          n=0; rc=0
          for g in scripts/guards/check-*.sh scripts/check-*.py; do
            [ -e "$g" ] || continue
            n=$((n+1))
            echo "::group::$g"
            case "$g" in
              *.sh) bash "$g" . || { echo "::error::guard failed: $g"; rc=1; } ;;
              *.py) python3 "$g" || { echo "::error::guard failed: $g"; rc=1; } ;;
            esac
            echo "::endgroup::"
          done
          echo "guards run: $n"
          # Zero is an ERROR, not a warning: this package ships checkers, so finding
          # none means the glob stopped matching, and the step would pass on silence.
          if [ "$n" -eq 0 ]; then
            echo "::error::no guards found -- the glob has stopped matching"
            exit 1
          fi
          exit $rc

      - name: Tag and manifest agree
        working-directory: pkg
        run: |
          set -uo pipefail
          ver=$(grep -m1 '^version[[:space:]]*=' nova.toml | sed 's/.*"\(.*\)".*/\1/')
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -1 || true)
          if [ -z "$tag" ]; then
            echo "no release tag on this commit — nothing to compare (manifest says $ver)"
            exit 0
          fi
          if [ "$tag" != "v$ver" ]; then
            echo "::error::tag $tag stands over a manifest declaring $ver"
            exit 1
          fi
          echo "tag $tag matches manifest $ver"

      # THE EXAMPLES ARE THE ONLY CONSUMERS OF THIS PACKAGE, and until 2026-09-13
      # nothing ran them. `nova test src` judges the inside; the examples are outside
      # `src` and were judged by nobody. The cost of that was measured rather than
      # imagined: eleven facade functions return `Result`, both examples were written
      # as though they return the value, and neither had ever compiled. A signature
      # change with no witness is a signature change nobody can notice.
      #
      # Type-check, not build: building them needs the published tag (their manifests
      # pull `duckdb` by `version = "0.1"`) and the vendored engine. Type-check is
      # what is available on every push, and it is exactly the half that was failing.
      #
      # Zero examples found is a FAILURE. A glob that stopped matching prints the same
      # green as a clean run, and this file already carries that lesson twice.
      - name: The examples still type-check
        working-directory: pkg
        env:
          NOVA_RT_DIR: ${{ github.workspace }}/nova/compiler-codegen/nova_rt
          NOVA_CG_INCLUDE: ${{ github.workspace }}/nova/compiler-codegen
          NOVA_STD_PATH: ${{ github.workspace }}/nova/std/src
        run: |
          set -uo pipefail
          n=$(find examples -name '*.nv' | wc -l)
          echo "example sources found: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::no example sources found -- the glob has stopped matching, and this step would pass on silence"
            exit 1
          fi
          out=$("${GITHUB_WORKSPACE}/nova/nova-cli/target/release/nova" check examples 2>&1); rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::an example no longer type-checks -- the package's public surface changed under its own documentation"
            exit 1
          fi
          # The runner prints a per-file verdict AND a summary. Trusting the exit code
          # alone is how an empty measurement passes for a full one.
          #
          # STRIP THE COLOUR FIRST, and this is not defensive habit. The checker wraps
          # the word `PASS` in ANSI when everything passed, so the bytes are
          # `ESC[32mPASS ESC[0m: 2` and the literal `PASS: ` is NOT present on a green
          # run. On a red run `PASS` is left plain. A grep for `PASS: ` therefore
          # matches only while the examples are broken -- a control that works
          # exclusively in the case it was not written for. Found by running this step
          # on a healthy tree before committing it.
          plain=$(echo "$out" | sed -E 's/\x1B\[[0-9;]*m//g')
          if ! echo "$plain" | grep -qE '^PASS: [0-9]+'; then
            echo "::error::the checker printed no summary line -- it may not have run"
            exit 1
          fi
          echo "$plain" | grep -E '^PASS: [0-9]+

      - name: nova test src
        working-directory: pkg
        env:
          NOVA_RT_DIR: ${{ github.workspace }}/nova/compiler-codegen/nova_rt
          NOVA_CG_INCLUDE: ${{ github.workspace }}/nova/compiler-codegen
          NOVA_STD_PATH: ${{ github.workspace }}/nova/std/src
        run: |
          set -uo pipefail
          test ! -f nova.override.toml || { echo "::error::nova.override.toml reached CI — it must stay gitignored"; exit 1; }
          out=$("${GITHUB_WORKSPACE}/nova/nova-cli/target/release/nova" test src 2>&1); rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && echo "$out" | grep -q "undefined reference to \`operator new\|undefined reference to \`operator delete\|__throw_"; then
            echo "::error::KNOWN BLOCKER, not a regression: DuckDB is C++ and this"
            echo "::error::toolchain cannot link a C++ runtime. [ffi] libs is one flat"
            echo "::error::list with no platform split, and naming stdc++ there would"
            echo "::error::make Windows degrade the whole package to SKIP. The compiler"
            echo "::error::has no notion of C++ at all: zero occurrences of cpp/cxx/stdc++"
            echo "::error::in link_prep.rs, manifest.rs or nova-cli."
            echo "::error::Windows builds and passes 21/21. Trace and what is needed:"
            echo "::error::claude-limits probes/ffi-cannot-link-cpp-runtime/FINDING.md"
          fi
          exit $rc

      # The suite reports PASS on a FILE. Reading that as "the tests passed" is how
      # an empty measurement passes for a full one -- it happened in this very
      # package. Assert the count the binary itself prints.
      - name: The suite actually ran its tests
        working-directory: pkg
        env:
          NOVA_RT_DIR: ${{ github.workspace }}/nova/compiler-codegen/nova_rt
          NOVA_CG_INCLUDE: ${{ github.workspace }}/nova/compiler-codegen
          NOVA_STD_PATH: ${{ github.workspace }}/nova/std/src
        run: |
          set -uo pipefail
          "${GITHUB_WORKSPACE}/nova/nova-cli/target/release/nova" build src/duckdb_test.nv
          bin=./duckdb_test
          [ -x "$bin" ] || bin=./duckdb_test.exe
          [ -x "$bin" ] || { echo "::error::the test binary was not produced"; exit 1; }
          out=$("$bin" 2>&1); rc=$?
          echo "$out" | tail -3
          if [ "$rc" -ne 0 ]; then
            echo "::error::the test binary exited $rc"
            exit 1
          fi
          line=$(echo "$out" | grep -oE '^[0-9]+/[0-9]+ passed$' | tail -1)
          if [ -z "$line" ]; then
            echo "::error::the suite printed no 'N/N passed' line — it may not have run"
            exit 1
          fi
          ran=${line%%/*}
          if [ "$ran" -eq 0 ]; then
            echo "::error::the suite ran zero tests"
            exit 1
          fi
          echo "the suite ran $line"
