# nova.toml — nova-duckdb: DuckDB bound for Nova (subplan 01.4 of claude-limits).
#
# Layout follows nova-tls, which is the template for a package with a C shim:
# `src/` holds the Nova surface, `native/` the shim and the vendored engine,
# `scripts/` the build. Module paths resolve relative to `src/` via `[lib] src`
# (D78 — a module path does NOT include `src`).
#
# WHAT THIS PACKAGE IS NOT: a complete binding of DuckDB. Version 0.1 gives Nova a
# finished core plus what `claude-limits` needs; the rest is added minor version by
# minor version as a consumer appears, WITHOUT rebuilding the library — the static
# archive already contains everything (01.4 §4.1). A request to widen it is an issue
# naming the consumer and the function, not a "while we are here".

[package]
name = "duckdb"
version = "0.1.0"
description = "DuckDB for Nova: real types (TIMESTAMPTZ, DECIMAL, UUID), Appender, statically linked with core_functions and icu"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nv-lang/nova-duckdb"

[lib]
src = "src"

[ffi]
# `duckdb_shim.h` is force-included, not merely `#include`d from the shim's own
# translation unit: every OTHER CU that calls a `ddb_*` extern needs the prototype
# in ITS OWN TU, or C falls back to implicit-int and truncates a 64-bit handle to
# 32 bits. nova-tls learned this one the hard way and says so in its own manifest.
c_shims      = ["native/duckdb_shim.c", "native/duckdb_shim.h"]
include_dirs = ["native/", "native/duckdb/src/include"]

# Order matters: dependent before dependency. Generated by
# `scripts/build-duckdb.*` into `scripts/libs-manifest.txt` and copied here by
# hand on a DuckDB version bump -- the manifest is the generated source of truth
# and `scripts/check-libs-manifest.py` compares the two, membership AND order
# (01.4 §8, "the vendored library list changes between DuckDB versions").
#
# Until 2026-09-08 this comment said "a test compares the two" and there was no such
# test: a claim with no mechanism, which is the same shape as a guard reporting an
# acceptance it never measured. The checker runs in CI right after the build, and a
# missing manifest is a FAILURE rather than a skip -- comparing nothing and calling
# it clean is the defect it was written to catch.
libs = [
  "core_functions_extension", "icu_extension", "duckdb_static",
  "duckdb_re2", "duckdb_fmt", "duckdb_utf8proc", "duckdb_hyperloglog",
  "duckdb_fastpforlib", "duckdb_skiplistlib", "duckdb_mbedtls", "duckdb_yyjson",
  "duckdb_fsst", "duckdb_zstd", "duckdb_miniz", "duckdb_pg_query",
  "duckdb_generated_extension_loader",
  # Windows system libraries, NOT produced by the build. Each was found by the
  # linker naming a symbol, not by guessing: `rstrtmgr` for RmStartSession and
  # RmEndSession -- DuckDB asks the Restart Manager WHO holds a locked database file
  # so its error can name the process -- and the usual companions of a C++ library
  # here. `scripts/check-libs-manifest.py` knows these are system-supplied and does
  # not expect them among the built artefacts.
  "rstrtmgr", "ws2_32", "bcrypt", "advapi32", "ole32", "shell32",
]
# `duckdb_pg_query` added 2026-09-08 from the first real build: it exists in v1.5.5
# and was not in this list. Exactly the drift 01.4 §8 predicts, and the reason
# `scripts/check-libs-manifest.py` compares this list with what the build produced
# instead of trusting it.

# Declared even while the directory is empty: a bare `libs` with no `lib_dirs`
# skips the detect-and-degrade probe entirely and hard-fails at link time.
# Package-relative, so it resolves the same standalone and as a path dependency.
#
# CORRECTION 2026-09-08, and it was mine. This comment first said that `lib_dirs`
# makes `nova test` SKIP on a checkout where DuckDB has not been built. IT DOES
# NOT, measured by running it: the probe degrades on missing LIBRARIES, but the
# `c_shims` are still compiled, and the shim fails on `duckdb.h: file not found`
# long before any library is looked for. So the honest state of a fresh checkout is
# CC-FAIL on `src/duckdb_test`, not SKIP, until `scripts/build-duckdb.*` has run and
# the submodule is present. I had generalised the claim from nova-tls's manifest
# comment without trying it here.
lib_dirs = ["native/lib"]

# NO `vendor_src_dirs`, and this is where nova-duckdb parts from nova-tls. That
# mechanism compiles every `.c` under a directory and archives the result; DuckDB is
# 655k lines of C++ built by CMake with extension targets, and a per-file `.c` sweep
# cannot produce `core_functions_extension` or `icu_extension`. The build is
# `scripts/build-duckdb.ps1` / `.sh`, run once, cached by
# `native/lib/.built` (01.4 §2).
